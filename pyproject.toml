[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortdrama-studio"
version = "1.0.0"
description = "完全离线可用的对话式连续短剧生成平台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
models = [
  "torch>=2.2", "transformers>=4.44", "accelerate>=0.30",
  "diffsynth>=2.1", "modelscope>=1.18", "funasr>=1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
